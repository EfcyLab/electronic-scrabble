<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electronic Scrabble - Administration</title>
</head>

<body>
    <main>
        <h1>Electronic Scrabble</h1>

        <p id="connection-status">
            Connecting...
        </p>

        <button id="create-game" type="button" disabled>
            Create Game
        </button>

        <section id="game-information" hidden>
            <h2>Game <span id="game-code"></span></h2>

            <p>
                Shared screen:
                <a id="screen-link"></a>
            </p>

            <p>
                Players:
                <a id="player-link"></a>
            </p>

            <h3>Players</h3>

            <ul id="player-list"></ul>
        </section>
    </main>

    <script>
        /**
         * Electronic Scrabble Administration Client
         *
         * Creates game sessions and displays the current lobby state.
         *
         * @version 0.2.0
         */

        const SERVER_HOST = window.location.hostname || 'localhost';
        const SERVER_PORT = 8080;

        const connectionStatus = document.getElementById(
            'connection-status'
        );

        const createGameButton = document.getElementById(
            'create-game'
        );

        const gameInformation = document.getElementById(
            'game-information'
        );

        const gameCodeElement = document.getElementById(
            'game-code'
        );

        const screenLink = document.getElementById('screen-link');
        const playerLink = document.getElementById('player-link');
        const playerList = document.getElementById('player-list');

        const socket = new WebSocket(
            `ws://${SERVER_HOST}:${SERVER_PORT}`
        );

        let currentGameCode = null;

        /**
         * Updates the displayed player list.
         *
         * @param {Array<Object>} players Public player list.
         *
         * @returns {void}
         */
        function updatePlayerList(players) {
            playerList.replaceChildren();

            players.forEach((player) => {
                const item = document.createElement('li');

                item.textContent = player.name;

                playerList.appendChild(item);
            });
        }

        socket.addEventListener('open', () => {
            connectionStatus.textContent = 'Connected';
            createGameButton.disabled = false;
        });

        socket.addEventListener('close', () => {
            connectionStatus.textContent = 'Disconnected';
            createGameButton.disabled = true;
        });

        socket.addEventListener('error', () => {
            connectionStatus.textContent = 'Connection error';
        });

        createGameButton.addEventListener('click', () => {
            socket.send(JSON.stringify({
                type: 'create-game'
            }));
        });

        socket.addEventListener('message', (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'game-created') {
                currentGameCode = data.gameCode;

                const screenUrl =
                    `${window.location.origin}/screen/` +
                    `?game=${encodeURIComponent(currentGameCode)}`;

                const playerUrl =
                    `${window.location.origin}/player/` +
                    `?game=${encodeURIComponent(currentGameCode)}`;

                gameCodeElement.textContent = currentGameCode;

                screenLink.href = screenUrl;
                screenLink.textContent = screenUrl;

                playerLink.href = playerUrl;
                playerLink.textContent = playerUrl;

                gameInformation.hidden = false;

                return;
            }

            if (
                data.type === 'game-state' &&
                data.game.code === currentGameCode
            ) {
                updatePlayerList(data.game.players);

                return;
            }

            if (data.type === 'error') {
                alert(data.message);
            }
        });
    </script>
</body>
</html>
