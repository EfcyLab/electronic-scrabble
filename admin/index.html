<!DOCTYPE html>
<html lang="en" data-theme="classic" data-language="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Scrabble - Administration</title>
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/components.css">
    <link rel="stylesheet" href="../shared/css/themes/classic.css">
    <link rel="stylesheet" href="../shared/css/themes/midnight.css">
    <link rel="stylesheet" href="../shared/css/themes/forest.css">
    <link rel="stylesheet" href="./css/admin.css">
    <script src="../shared/i18n/en.js"></script>
    <script src="../shared/i18n/fr.js"></script>
    <script src="../shared/js/i18n-manager.js"></script>
    <script src="../shared/js/theme-manager.js" defer></script>
</head>
<body data-i18n-page-title="admin.pageTitle">
    <main class="app-shell">
        <header class="app-header">
            <div class="app-brand">
                <div class="app-logo" aria-hidden="true">ES</div>
                <div>
                    <h1 class="app-title" data-i18n="admin.title">Administration</h1>
                    <p class="app-subtitle" data-i18n="admin.subtitle">Electronic Scrabble control room</p>
                </div>
            </div>

            <div class="row">
                <p id="connection-status" class="status" data-i18n="common.connecting">Connecting...</p>
                <label class="field">
                    <span class="field__label" data-i18n="common.theme">Theme</span>
                    <select class="select theme-picker" data-theme-picker>
                        <option value="classic" data-i18n="theme.classic">Classic</option>
                        <option value="midnight" data-i18n="theme.midnight">Midnight</option>
                        <option value="forest" data-i18n="theme.forest">Forest</option>
                    </select>
                </label>

                <label class="field">
                    <span class="field__label" data-i18n="common.language">Language</span>
                    <select class="select language-picker" data-language-picker>
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                    </select>
                </label>
            </div>
        </header>

        <section class="card stack">
            <h2 class="card__title" data-i18n="admin.session">Game session</h2>
            <button id="create-game" type="button" disabled data-i18n="admin.createGame">Create Game</button>

            <section id="game-information" hidden>
                <h2><span data-i18n="common.game">Game</span> <span id="game-code" class="game-code"></span></h2>

                <p><span data-i18n="common.status">Status</span>: <strong id="game-status" data-i18n="common.lobby">Lobby</strong></p>

                <p><span data-i18n="admin.wordValidation">Word validation</span>: <strong id="word-validation-status" data-i18n="common.waiting">Waiting</strong></p>

                <p id="turn-information" hidden>
                    <span data-i18n="common.turn">Turn</span> <strong id="turn-number">0</strong> — <strong id="turn-player" data-i18n="common.waiting">Waiting</strong>
                </p>

                <p id="last-action-information" hidden>
                    <span data-i18n="admin.lastActionLabel">Last action</span>: <strong id="last-action-player"></strong> —
                    <span id="last-action-summary"></span>
                </p>

                <p>
                    <span data-i18n="admin.sharedScreen">Shared screen</span>:<br>
                    <a id="screen-link"></a>
                </p>

                <p>
                    <span data-i18n="admin.playerAccess">Players</span>:<br>
                    <a id="player-link"></a>
                </p>

                <h3 data-i18n="common.players">Players</h3>
                <ul id="player-list"></ul>

                <section id="starting-draw" class="starting-draw" hidden>
                    <h3 data-i18n="admin.startingDraw">Starting-player draw</h3>
                    <div id="starting-draw-rounds" class="starting-draw-rounds"></div>
                    <p id="starting-player-winner" class="starting-player-winner"></p>
                </section>

                <section id="final-result" class="final-result" hidden>
                    <h3 data-i18n="admin.finalResult">Final result</h3>
                    <p id="end-reason" class="muted"></p>
                    <ol id="final-ranking" class="final-ranking"></ol>
                </section>

                <button id="start-game" type="button" disabled data-i18n="admin.startGame">Start Game</button>
                <p id="start-help" class="muted" data-i18n="admin.minimumPlayers">At least two connected players are required.</p>
            </section>
        </section>
    </main>

    <script>
        /**
         * Electronic Scrabble Administration Client
         *
         * Creates game sessions, displays the lobby state,
         * and starts a game when all players are ready.
         *
         * @version 1.0.0
         */

        const I18n = window.ElectronicScrabbleI18n;

        const SERVER_HOST = window.location.hostname || 'localhost';
        const SERVER_PORT = 8080;
        const MIN_PLAYERS = 2;
        const MAX_PLAYERS = 4;

        const connectionStatus = document.getElementById('connection-status');
        const createGameButton = document.getElementById('create-game');
        const startGameButton = document.getElementById('start-game');
        const startHelp = document.getElementById('start-help');
        const gameInformation = document.getElementById('game-information');
        const gameCodeElement = document.getElementById('game-code');
        const gameStatusElement = document.getElementById('game-status');
        const wordValidationStatus = document.getElementById('word-validation-status');
        const turnInformation = document.getElementById('turn-information');
        const turnNumberElement = document.getElementById('turn-number');
        const turnPlayerElement = document.getElementById('turn-player');
        const lastActionInformation = document.getElementById('last-action-information');
        const lastActionPlayer = document.getElementById('last-action-player');
        const lastActionSummary = document.getElementById('last-action-summary');
        const screenLink = document.getElementById('screen-link');
        const playerLink = document.getElementById('player-link');
        const playerList = document.getElementById('player-list');
        const startingDrawSection = document.getElementById('starting-draw');
        const startingDrawRounds = document.getElementById('starting-draw-rounds');
        const startingPlayerWinner = document.getElementById('starting-player-winner');
        const finalResultSection = document.getElementById('final-result');
        const endReasonElement = document.getElementById('end-reason');
        const finalRanking = document.getElementById('final-ranking');

        const socket = new WebSocket(`ws://${SERVER_HOST}:${SERVER_PORT}`);

        let currentGameCode = null;
        let currentGameStatus = 'lobby';
        let lastGameState = null;
        let connectionStatusKey = 'common.connecting';


        /**
         * Renders the public starting-player draw.
         *
         * @param {Object|null} startingPlayerDraw Starting-player draw result.
         *
         * @returns {void}
         */
        function renderStartingPlayerDraw(startingPlayerDraw) {
            startingDrawRounds.replaceChildren();

            if (startingPlayerDraw === null) {
                startingDrawSection.hidden = true;
                return;
            }

            startingPlayerDraw.rounds.forEach((round) => {
                const roundElement = document.createElement('div');
                const title = document.createElement('strong');
                const draws = document.createElement('div');

                roundElement.className = 'starting-draw-round';
                title.textContent = I18n.t('common.round', { round: round.round });
                draws.className = 'starting-draw-letters';

                round.draws.forEach((draw) => {
                    const item = document.createElement('span');
                    const blankNote = draw.blankRedraws > 0
                        ? I18n.tp('admin.blankRedraw', draw.blankRedraws)
                        : '';

                    item.textContent = `${draw.playerName}: ${draw.letter}${blankNote}`;
                    draws.appendChild(item);
                });

                roundElement.append(title, draws);
                startingDrawRounds.appendChild(roundElement);
            });

            startingPlayerWinner.textContent = I18n.t('admin.playerFirst', {
                name: startingPlayerDraw.startingPlayerName
            });
            startingDrawSection.hidden = false;
        }

        /**
         * Returns a human-readable end-game reason.
         *
         * @param {string} reason End-game reason code.
         *
         * @returns {string} End-game reason label.
         */
        function getEndReasonLabel(reason) {
            if (reason === 'rack-emptied') {
                return I18n.t('end.rackEmptied');
            }

            if (reason === 'consecutive-passes') {
                return I18n.t('end.consecutivePasses');
            }

            return I18n.t('end.default');
        }

        /**
         * Renders the public final ranking.
         *
         * @param {Object|null} finalResult Public final result.
         *
         * @returns {void}
         */
        function renderFinalResult(finalResult) {
            finalRanking.replaceChildren();

            if (finalResult === null) {
                finalResultSection.hidden = true;
                return;
            }

            endReasonElement.textContent = getEndReasonLabel(finalResult.reason);

            finalResult.rankings.forEach((ranking) => {
                const item = document.createElement('li');
                const adjustment = ranking.adjustment >= 0
                    ? `+${ranking.adjustment}`
                    : String(ranking.adjustment);

                item.textContent = I18n.t('admin.finalRanking', {
                    name: ranking.playerName,
                    score: ranking.finalScore,
                    adjustment
                });

                finalRanking.appendChild(item);
            });

            finalResultSection.hidden = false;
        }

        /**
         * Updates the displayed lobby state.
         *
         * @param {Object} game Public game state.
         *
         * @returns {void}
         */
        function updateGameState(game) {
            lastGameState = game;
            currentGameStatus = game.status;
            const statusKey = {
                lobby: 'common.lobby',
                starting: 'common.starting',
                playing: 'common.playing',
                finished: 'common.finished'
            }[game.status] ?? 'common.waiting';
            gameStatusElement.textContent = I18n.t(statusKey);
            renderStartingPlayerDraw(
                game.status === 'starting' ? game.startingPlayerDraw : null
            );

            if (game.wordValidation?.enabled) {
                wordValidationStatus.textContent = I18n.t('admin.validationEnabled', {
                    name: game.wordValidation.dictionaryName,
                    count: game.wordValidation.wordCount
                });
            } else {
                wordValidationStatus.textContent = I18n.t('admin.validationDisabled');
            }

            playerList.replaceChildren();

            if (game.status === 'playing') {
                const currentPlayer = game.players.find(
                    (player) => player.id === game.currentPlayerId
                );

                turnNumberElement.textContent = game.turnNumber;
                turnPlayerElement.textContent = currentPlayer
                    ? currentPlayer.name
                    : I18n.t('common.waiting');
                turnInformation.hidden = false;
            } else {
                turnInformation.hidden = true;
            }

            if (game.lastAction !== null) {
                lastActionPlayer.textContent = game.lastAction.playerName;

                if (game.lastAction.type === 'move') {
                    const words = game.lastAction.words
                        .map((word) => word.text)
                        .join(', ');

                    lastActionSummary.textContent = I18n.t('admin.lastAction.move', {
                        words,
                        score: game.lastAction.score
                    });
                } else if (game.lastAction.type === 'exchange') {
                    const count = game.lastAction.exchangedCount;

                    lastActionSummary.textContent = I18n.t('admin.lastAction.exchange', { count });
                } else if (game.lastAction.type === 'pass') {
                    lastActionSummary.textContent = I18n.t('admin.lastAction.pass');
                } else {
                    lastActionSummary.textContent = I18n.t('admin.lastAction.completed');
                }

                lastActionInformation.hidden = false;
            } else {
                lastActionInformation.hidden = true;
            }

            renderFinalResult(game.finalResult);

            game.players.forEach((player) => {
                const item = document.createElement('li');
                const connectionLabel = player.connected ? I18n.t('common.connected') : I18n.t('common.disconnected');

                item.textContent = game.status === 'finished'
                    ? `${player.name} — ${player.score} pts`
                    : `${player.name} — ${connectionLabel}`;
                playerList.appendChild(item);
            });

            const playerCountIsValid =
                game.players.length >= MIN_PLAYERS &&
                game.players.length <= MAX_PLAYERS;

            const allPlayersConnected = game.players.every(
                (player) => player.connected
            );

            const canDetermineStartingPlayer =
                game.status === 'lobby' &&
                playerCountIsValid &&
                allPlayersConnected;

            const canBeginPlay =
                game.status === 'starting' &&
                game.startingPlayerDraw !== null &&
                allPlayersConnected;

            startGameButton.disabled = !canDetermineStartingPlayer && !canBeginPlay;

            if (game.status === 'finished') {
                startGameButton.textContent = I18n.t('admin.gameFinished');
                startHelp.textContent = I18n.t('admin.finishedHelp');
                return;
            }

            if (game.status === 'playing') {
                startGameButton.textContent = I18n.t('admin.gameStarted');
                startHelp.textContent = I18n.t('admin.startedHelp');
                return;
            }

            if (game.status === 'starting') {
                startGameButton.textContent = I18n.t('admin.dealAndStart');
                startHelp.textContent = allPlayersConnected
                    ? I18n.t('admin.firstDetermined')
                    : I18n.t('admin.reconnectBeforeDeal');
                return;
            }

            startGameButton.textContent = I18n.t('admin.determineFirst');

            if (game.players.length < MIN_PLAYERS) {
                startHelp.textContent = I18n.t('admin.minimumPlayers');
                return;
            }

            if (!allPlayersConnected) {
                startHelp.textContent = I18n.t('admin.mustConnect');
                return;
            }

            startHelp.textContent = I18n.t('admin.readyFirst');
        }

        socket.addEventListener('open', () => {
            connectionStatusKey = 'common.connected';
            connectionStatus.textContent = I18n.t(connectionStatusKey);
            createGameButton.disabled = false;
        });

        socket.addEventListener('close', () => {
            connectionStatusKey = 'common.disconnected';
            connectionStatus.textContent = I18n.t(connectionStatusKey);
            createGameButton.disabled = true;
            startGameButton.disabled = true;
        });

        socket.addEventListener('error', () => {
            connectionStatusKey = 'common.connectionError';
            connectionStatus.textContent = I18n.t(connectionStatusKey);
        });

        createGameButton.addEventListener('click', () => {
            socket.send(JSON.stringify({
                type: 'create-game'
            }));
        });

        startGameButton.addEventListener('click', () => {
            socket.send(JSON.stringify({
                type: currentGameStatus === 'starting'
                    ? 'begin-play'
                    : 'start-game'
            }));
        });

        document.addEventListener('electronic-scrabble:language-changed', () => {
            connectionStatus.textContent = I18n.t(connectionStatusKey);

            if (lastGameState !== null) {
                updateGameState(lastGameState);
            }
        });

        socket.addEventListener('message', (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'game-created') {
                currentGameCode = data.gameCode;

                const screenUrl =
                    `${window.location.origin}/screen/?game=` +
                    encodeURIComponent(currentGameCode);

                const playerUrl =
                    `${window.location.origin}/player/?game=` +
                    encodeURIComponent(currentGameCode);

                gameCodeElement.textContent = currentGameCode;
                screenLink.href = screenUrl;
                screenLink.textContent = screenUrl;
                playerLink.href = playerUrl;
                playerLink.textContent = playerUrl;

                createGameButton.disabled = true;
                gameInformation.hidden = false;
                return;
            }

            if (
                data.type === 'game-state' &&
                data.game.code === currentGameCode
            ) {
                updateGameState(data.game);
                return;
            }

            if (data.type === 'error') {
                alert(I18n.t(`error.${data.code}`) === `error.${data.code}` ? data.message : I18n.t(`error.${data.code}`));
            }
        });
    
    </script>
</body>
</html>
