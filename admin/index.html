<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Scrabble - Administration</title>
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/components.css">
    <link rel="stylesheet" href="../shared/css/themes/classic.css">
    <link rel="stylesheet" href="../shared/css/themes/midnight.css">
    <link rel="stylesheet" href="../shared/css/themes/forest.css">
    <link rel="stylesheet" href="./css/admin.css">
    <script src="../shared/js/theme-manager.js" defer></script>
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <div class="app-brand">
                <div class="app-logo" aria-hidden="true">ES</div>
                <div>
                    <h1 class="app-title">Administration</h1>
                    <p class="app-subtitle">Electronic Scrabble control room</p>
                </div>
            </div>

            <div class="row">
                <p id="connection-status" class="status">Connecting...</p>
                <label class="field">
                    <span class="field__label">Theme</span>
                    <select class="select theme-picker" data-theme-picker>
                        <option value="classic">Classic</option>
                        <option value="midnight">Midnight</option>
                        <option value="forest">Forest</option>
                    </select>
                </label>
            </div>
        </header>

        <section class="card stack">
            <h2 class="card__title">Game session</h2>
            <button id="create-game" type="button" disabled>Create Game</button>

            <section id="game-information" hidden>
                <h2>Game <span id="game-code" class="game-code"></span></h2>

                <p>Status: <strong id="game-status">Lobby</strong></p>

                <p id="turn-information" hidden>
                    Turn <strong id="turn-number">0</strong> — <strong id="turn-player">Waiting</strong>
                </p>

                <p id="last-move-information" hidden>
                    Last move: <strong id="last-move-player"></strong> —
                    <span id="last-move-words"></span> —
                    <strong>+<span id="last-move-score">0</span> pts</strong>
                </p>

                <p>
                    Shared screen:<br>
                    <a id="screen-link"></a>
                </p>

                <p>
                    Players:<br>
                    <a id="player-link"></a>
                </p>

                <h3>Players</h3>
                <ul id="player-list"></ul>

                <button id="start-game" type="button" disabled>Start Game</button>
                <p id="start-help" class="muted">At least two connected players are required.</p>
            </section>
        </section>
    </main>

    <script>
        /**
         * Electronic Scrabble Administration Client
         *
         * Creates game sessions, displays the lobby state,
         * and starts a game when all players are ready.
         *
         * @version 0.5.0
         */

        const SERVER_HOST = window.location.hostname || 'localhost';
        const SERVER_PORT = 8080;
        const MIN_PLAYERS = 2;
        const MAX_PLAYERS = 4;

        const connectionStatus = document.getElementById('connection-status');
        const createGameButton = document.getElementById('create-game');
        const startGameButton = document.getElementById('start-game');
        const startHelp = document.getElementById('start-help');
        const gameInformation = document.getElementById('game-information');
        const gameCodeElement = document.getElementById('game-code');
        const gameStatusElement = document.getElementById('game-status');
        const turnInformation = document.getElementById('turn-information');
        const turnNumberElement = document.getElementById('turn-number');
        const turnPlayerElement = document.getElementById('turn-player');
        const lastMoveInformation = document.getElementById('last-move-information');
        const lastMovePlayer = document.getElementById('last-move-player');
        const lastMoveWords = document.getElementById('last-move-words');
        const lastMoveScore = document.getElementById('last-move-score');
        const screenLink = document.getElementById('screen-link');
        const playerLink = document.getElementById('player-link');
        const playerList = document.getElementById('player-list');

        const socket = new WebSocket(`ws://${SERVER_HOST}:${SERVER_PORT}`);

        let currentGameCode = null;

        /**
         * Updates the displayed lobby state.
         *
         * @param {Object} game Public game state.
         *
         * @returns {void}
         */
        function updateGameState(game) {
            gameStatusElement.textContent = game.status;
            playerList.replaceChildren();

            if (game.status === 'playing') {
                const currentPlayer = game.players.find(
                    (player) => player.id === game.currentPlayerId
                );

                turnNumberElement.textContent = game.turnNumber;
                turnPlayerElement.textContent = currentPlayer
                    ? currentPlayer.name
                    : 'Waiting';
                turnInformation.hidden = false;
            } else {
                turnInformation.hidden = true;
            }

            if (game.lastMove !== null) {
                lastMovePlayer.textContent = game.lastMove.playerName;
                lastMoveWords.textContent = game.lastMove.words
                    .map((word) => word.text)
                    .join(', ');
                lastMoveScore.textContent = game.lastMove.score;
                lastMoveInformation.hidden = false;
            } else {
                lastMoveInformation.hidden = true;
            }

            game.players.forEach((player) => {
                const item = document.createElement('li');
                const connectionLabel = player.connected ? 'connected' : 'disconnected';

                item.textContent = `${player.name} — ${connectionLabel}`;
                playerList.appendChild(item);
            });

            const playerCountIsValid =
                game.players.length >= MIN_PLAYERS &&
                game.players.length <= MAX_PLAYERS;

            const allPlayersConnected = game.players.every(
                (player) => player.connected
            );

            const canStart =
                game.status === 'lobby' &&
                playerCountIsValid &&
                allPlayersConnected;

            startGameButton.disabled = !canStart;

            if (game.status !== 'lobby') {
                startHelp.textContent = 'Game started.';
                return;
            }

            if (game.players.length < MIN_PLAYERS) {
                startHelp.textContent = 'At least two connected players are required.';
                return;
            }

            if (!allPlayersConnected) {
                startHelp.textContent = 'All players must be connected before starting.';
                return;
            }

            startHelp.textContent = 'Ready to start.';
        }

        socket.addEventListener('open', () => {
            connectionStatus.textContent = 'Connected';
            createGameButton.disabled = false;
        });

        socket.addEventListener('close', () => {
            connectionStatus.textContent = 'Disconnected';
            createGameButton.disabled = true;
            startGameButton.disabled = true;
        });

        socket.addEventListener('error', () => {
            connectionStatus.textContent = 'Connection error';
        });

        createGameButton.addEventListener('click', () => {
            socket.send(JSON.stringify({
                type: 'create-game'
            }));
        });

        startGameButton.addEventListener('click', () => {
            socket.send(JSON.stringify({
                type: 'start-game'
            }));
        });

        socket.addEventListener('message', (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'game-created') {
                currentGameCode = data.gameCode;

                const screenUrl =
                    `${window.location.origin}/screen/?game=` +
                    encodeURIComponent(currentGameCode);

                const playerUrl =
                    `${window.location.origin}/player/?game=` +
                    encodeURIComponent(currentGameCode);

                gameCodeElement.textContent = currentGameCode;
                screenLink.href = screenUrl;
                screenLink.textContent = screenUrl;
                playerLink.href = playerUrl;
                playerLink.textContent = playerUrl;

                createGameButton.disabled = true;
                gameInformation.hidden = false;
                return;
            }

            if (
                data.type === 'game-state' &&
                data.game.code === currentGameCode
            ) {
                updateGameState(data.game);
                return;
            }

            if (data.type === 'error') {
                alert(data.message);
            }
        });
    
    </script>
</body>
</html>
