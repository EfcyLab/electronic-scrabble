<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electronic Scrabble - Player</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        main {
            width: min(500px, 90%);
        }

        h1 {
            text-align: center;
        }

        #connection-status {
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        input,
        button {
            width: 100%;
            box-sizing: border-box;
            padding: 1rem;
            font-size: 1rem;
        }

        button {
            margin-top: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main>
        <h1>Electronic Scrabble</h1>

        <div id="connection-status">
            Connecting...
        </div>

        <form id="player-form">
            <label for="player-name">
                Player name
            </label>

            <input
                id="player-name"
                name="player-name"
                type="text"
                required
                autocomplete="name"
            >

            <label for="player-message">
                Message
            </label>

            <input
                id="player-message"
                name="player-message"
                type="text"
                required
            >

            <button type="submit">
                Send
            </button>
        </form>
    </main>

    <script>
        /**
         * Electronic Scrabble Player Client
         *
         * Connects a player device to the game WebSocket server
         * and sends player actions.
         *
         * @version 0.1.0
         */

        const SERVER_HOST = window.location.hostname || 'localhost';
        const SERVER_PORT = 8080;

        const form = document.getElementById('player-form');
        const playerNameInput = document.getElementById('player-name');
        const playerMessageInput = document.getElementById('player-message');
        const connectionStatus = document.getElementById('connection-status');

        const socket = new WebSocket(
            `ws://${SERVER_HOST}:${SERVER_PORT}`
        );

        /**
         * Updates the connection status displayed to the player.
         *
         * @param {string} status New connection status.
         *
         * @returns {void}
         */
        function updateConnectionStatus(status) {
            connectionStatus.textContent = status;
        }

        socket.addEventListener('open', () => {
            updateConnectionStatus('Connected');
        });

        socket.addEventListener('close', () => {
            updateConnectionStatus('Disconnected');
        });

        socket.addEventListener('error', () => {
            updateConnectionStatus('Connection error');
        });

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            if (socket.readyState !== WebSocket.OPEN) {
                alert('The server connection is not available.');
                return;
            }

            const message = {
                type: 'player-action',
                player: playerNameInput.value.trim(),
                message: playerMessageInput.value.trim()
            };

            socket.send(JSON.stringify(message));

            playerMessageInput.value = '';
            playerMessageInput.focus();
        });
    </script>
</body>
</html>
