<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electronic Scrabble - Shared Screen</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #1d1d1d;
            color: #ffffff;
        }

        main {
            width: min(900px, 90%);
            text-align: center;
        }

        h1 {
            font-size: 3rem;
        }

        #connection-status {
            margin-bottom: 2rem;
            font-weight: bold;
        }

        #message {
            min-height: 150px;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #2d2d2d;
            font-size: 2rem;
        }

        #player-name {
            margin-top: 1rem;
            font-size: 1.25rem;
        }
    </style>
</head>

<body>
    <main>
        <h1>Electronic Scrabble</h1>

        <div id="connection-status">
            Connecting...
        </div>

        <div id="message">
            Waiting for a player action...
        </div>

        <div id="player-name"></div>
    </main>

    <script>
        /**
         * Electronic Scrabble Shared Screen Client
         *
         * Connects the shared display to the game WebSocket server
         * and displays player actions in real time.
         *
         * @version 0.1.0
         */

        const SERVER_HOST = window.location.hostname || 'localhost';
        const SERVER_PORT = 8080;

        const connectionStatus = document.getElementById('connection-status');
        const messageElement = document.getElementById('message');
        const playerNameElement = document.getElementById('player-name');

        const socket = new WebSocket(
            `ws://${SERVER_HOST}:${SERVER_PORT}`
        );

        /**
         * Updates the connection status displayed on screen.
         *
         * @param {string} status New connection status.
         *
         * @returns {void}
         */
        function updateConnectionStatus(status) {
            connectionStatus.textContent = status;
        }

        socket.addEventListener('open', () => {
            updateConnectionStatus('Connected');
        });

        socket.addEventListener('close', () => {
            updateConnectionStatus('Disconnected');
        });

        socket.addEventListener('error', () => {
            updateConnectionStatus('Connection error');
        });

        socket.addEventListener('message', (event) => {
            try {
                const data = JSON.parse(event.data);

                if (data.type !== 'player-action') {
                    return;
                }

                messageElement.textContent = data.message ?? '';
                playerNameElement.textContent = data.player
                    ? `Player: ${data.player}`
                    : '';
            } catch (error) {
                console.error('Invalid server message:', error);
            }
        });
    </script>
</body>
</html>
