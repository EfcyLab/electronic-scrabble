<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Scrabble - Shared Screen</title>
</head>
<body>
    <main>
        <h1>Electronic Scrabble</h1>

        <p id="connection-status">Connecting...</p>

        <section>
            <h2>Game <span id="game-code">----</span></h2>

            <p>
                Status:
                <strong id="game-status">Lobby</strong>
            </p>

            <p id="bag-information" hidden>
                Tiles remaining:
                <strong id="bag-remaining">0</strong>
            </p>

            <h3>Players</h3>
            <ul id="player-list"></ul>
        </section>
    </main>

    <script>
        /**
         * Electronic Scrabble Shared Screen Client
         *
         * Displays the public game state without exposing private racks.
         *
         * @version 0.3.0
         */

        const SERVER_HOST = window.location.hostname || 'localhost';
        const SERVER_PORT = 8080;

        const parameters = new URLSearchParams(window.location.search);
        const gameCode = parameters.get('game')?.toUpperCase() ?? '';

        const connectionStatus = document.getElementById('connection-status');
        const gameCodeElement = document.getElementById('game-code');
        const gameStatusElement = document.getElementById('game-status');
        const bagInformation = document.getElementById('bag-information');
        const bagRemainingElement = document.getElementById('bag-remaining');
        const playerList = document.getElementById('player-list');

        gameCodeElement.textContent = gameCode || '----';

        const socket = new WebSocket(`ws://${SERVER_HOST}:${SERVER_PORT}`);

        /**
         * Updates the public game state on the shared display.
         *
         * @param {Object} game Public game state.
         *
         * @returns {void}
         */
        function updateGameState(game) {
            gameStatusElement.textContent = game.status;
            playerList.replaceChildren();

            if (game.bagRemaining !== null) {
                bagInformation.hidden = false;
                bagRemainingElement.textContent = game.bagRemaining;
            } else {
                bagInformation.hidden = true;
            }

            game.players.forEach((player) => {
                const item = document.createElement('li');
                const connectionLabel = player.connected ? '' : ' — disconnected';

                if (game.status === 'playing') {
                    item.textContent =
                        `${player.name} — ${player.score} pts — ` +
                        `${player.rackCount} tiles${connectionLabel}`;
                } else {
                    item.textContent = `${player.name}${connectionLabel}`;
                }

                playerList.appendChild(item);
            });
        }

        socket.addEventListener('open', () => {
            connectionStatus.textContent = 'Connected';

            if (!gameCode) {
                connectionStatus.textContent = 'Missing game code';
                return;
            }

            socket.send(JSON.stringify({
                type: 'watch-game',
                gameCode
            }));
        });

        socket.addEventListener('close', () => {
            connectionStatus.textContent = 'Disconnected';
        });

        socket.addEventListener('error', () => {
            connectionStatus.textContent = 'Connection error';
        });

        socket.addEventListener('message', (event) => {
            const data = JSON.parse(event.data);

            if (
                data.type === 'game-state' &&
                data.game.code === gameCode
            ) {
                updateGameState(data.game);
                return;
            }

            if (data.type === 'error') {
                connectionStatus.textContent = data.message;
            }
        });
    </script>
</body>
</html>
