<!DOCTYPE html>
<html lang="en" data-theme="classic" data-language="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Scrabble - Shared Screen</title>

    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/components.css">
    <link rel="stylesheet" href="../shared/css/themes/classic.css">
    <link rel="stylesheet" href="../shared/css/themes/midnight.css">
    <link rel="stylesheet" href="../shared/css/themes/forest.css">
    <link rel="stylesheet" href="./css/screen.css">

    <script src="../shared/i18n/en.js"></script>
    <script src="../shared/i18n/fr.js"></script>
    <script src="../shared/js/i18n-manager.js"></script>
    <script src="../shared/js/reconnecting-websocket.js"></script>
    <script src="../shared/js/theme-manager.js" defer></script>
</head>
<body data-i18n-page-title="screen.pageTitle">
    <main class="app-shell">
        <header class="app-header">
            <div class="app-brand">
                <div class="app-logo" aria-hidden="true">ES</div>
                <div>
                    <h1 class="app-title">Electronic Scrabble</h1>
                    <p class="app-subtitle"><span data-i18n="common.game">Game</span> <strong id="game-code">----</strong></p>
                </div>
            </div>

            <div class="row">
                <p id="connection-status" class="status" data-i18n="common.connecting">Connecting...</p>

                <label class="field">
                    <span class="field__label" data-i18n="common.theme">Theme</span>
                    <select class="select theme-picker" data-theme-picker>
                        <option value="classic" data-i18n="theme.classic">Classic</option>
                        <option value="midnight" data-i18n="theme.midnight">Midnight</option>
                        <option value="forest" data-i18n="theme.forest">Forest</option>
                    </select>
                </label>

                <label class="field">
                    <span class="field__label" data-i18n="common.language">Language</span>
                    <select class="select language-picker" data-language-picker>
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                    </select>
                </label>
            </div>
        </header>

        <div class="screen-layout">
            <section class="board-frame">
                <div id="board" role="grid" aria-label="Scrabble board" data-i18n-aria-label="player.board.aria"></div>
            </section>

            <aside class="screen-sidebar">
                <section class="screen-card">
                    <h2 class="card__title" data-i18n="screen.gamePanel">Game</h2>
                    <p><span data-i18n="common.status">Status</span>: <strong id="game-status" data-i18n="common.lobby">Lobby</strong></p>
                    <p><span data-i18n="screen.words">Words</span>: <strong id="word-validation-status" data-i18n="common.waiting">Waiting</strong></p>
                    <p id="turn-information" hidden>
                        <span data-i18n="common.turn">Turn</span> <strong id="turn-number">0</strong><br>
                        <span id="current-player-name" data-i18n="common.waiting">Waiting</span>
                    </p>
                    <p id="bag-information" hidden>
                        <span data-i18n="screen.tilesRemainingLabel">Tiles remaining</span>: <strong id="bag-remaining">0</strong>
                    </p>
                </section>

                <section id="turn-clock-card" class="screen-card turn-clock-card" hidden>
                    <div class="turn-clock-header">
                        <h2 id="turn-clock-title" class="card__title" data-i18n="screen.turnClock">Turn clock</h2>
                        <span id="turn-clock-state" class="status"></span>
                    </div>
                    <div id="turn-clock-value" class="turn-clock-value" aria-live="off">00:00</div>
                    <p id="turn-clock-player" class="turn-clock-player"></p>
                </section>

                <section id="starting-player-card" class="screen-card starting-player-card" hidden>
                    <h2 class="card__title" data-i18n="screen.whoStarts">Who starts?</h2>
                    <div id="starting-draw-rounds" class="starting-draw-rounds"></div>
                    <p id="starting-player-winner" class="starting-player-winner"></p>
                </section>


                <section id="challenge-card" class="screen-card challenge-card" hidden>
                    <h2 class="card__title" data-i18n="screen.challengeWindow">Challenge window</h2>
                    <p id="challenge-summary" class="last-move-words"></p>
                    <p class="status status--warning" data-i18n="screen.challengeWaiting">Waiting for acceptance or challenge</p>
                </section>

                <section id="last-action-card" class="screen-card" hidden>
                    <h2 class="card__title" data-i18n="screen.lastAction">Last action</h2>
                    <p><strong id="last-action-player"></strong></p>
                    <p id="last-action-summary" class="last-move-words"></p>
                    <p id="last-action-score" class="last-move-score" hidden>
                        +<span id="last-action-score-value">0</span> pts
                    </p>
                </section>

                <section id="final-result-card" class="screen-card final-result-card" hidden>
                    <h2 class="card__title" data-i18n="screen.finalResult">Final result</h2>
                    <p id="final-winner" class="final-winner"></p>
                    <p id="end-reason" class="last-move-words"></p>
                    <ol id="final-ranking" class="final-ranking"></ol>
                </section>

                <section class="screen-card">
                    <h2 class="card__title" data-i18n="common.players">Players</h2>
                    <ul id="player-list"></ul>
                </section>
            </aside>
        </div>
    </main>

    <script>
        /**
         * Electronic Scrabble Shared Screen Client
         *
         * Displays the public game state, active turn, last accepted move,
         * and the standard board without receiving private player racks.
         *
         * @author Electronic Scrabble Project
         * @version 1.1.0
         */

        const I18n = window.ElectronicScrabbleI18n;

        const SERVER_HOST = window.location.hostname || 'localhost';
        const SERVER_PORT = 8080;

        const PREMIUM_LABELS = Object.freeze({
            DL: { key: 'premium.DL.short', className: 'board-cell--dl' },
            TL: { key: 'premium.TL.short', className: 'board-cell--tl' },
            DW: { key: 'premium.DW.short', className: 'board-cell--dw' },
            TW: { key: 'premium.TW.short', className: 'board-cell--tw' }
        });

        const parameters = new URLSearchParams(window.location.search);
        const gameCode = parameters.get('game')?.toUpperCase() ?? '';

        const connectionStatus = document.getElementById('connection-status');
        const gameCodeElement = document.getElementById('game-code');
        const gameStatusElement = document.getElementById('game-status');
        const wordValidationStatus = document.getElementById('word-validation-status');
        const turnInformation = document.getElementById('turn-information');
        const turnNumberElement = document.getElementById('turn-number');
        const currentPlayerNameElement = document.getElementById('current-player-name');
        const bagInformation = document.getElementById('bag-information');
        const bagRemainingElement = document.getElementById('bag-remaining');
        const turnClockCard = document.getElementById('turn-clock-card');
        const turnClockState = document.getElementById('turn-clock-state');
        const turnClockValue = document.getElementById('turn-clock-value');
        const turnClockPlayer = document.getElementById('turn-clock-player');
        const startingPlayerCard = document.getElementById('starting-player-card');
        const startingDrawRounds = document.getElementById('starting-draw-rounds');
        const startingPlayerWinner = document.getElementById('starting-player-winner');
        const challengeCard = document.getElementById('challenge-card');
        const challengeSummary = document.getElementById('challenge-summary');
        const lastActionCard = document.getElementById('last-action-card');
        const lastActionPlayer = document.getElementById('last-action-player');
        const lastActionSummary = document.getElementById('last-action-summary');
        const lastActionScore = document.getElementById('last-action-score');
        const lastActionScoreValue = document.getElementById('last-action-score-value');
        const finalResultCard = document.getElementById('final-result-card');
        const finalWinner = document.getElementById('final-winner');
        const endReasonElement = document.getElementById('end-reason');
        const finalRanking = document.getElementById('final-ranking');
        const playerList = document.getElementById('player-list');
        const boardElement = document.getElementById('board');

        gameCodeElement.textContent = gameCode || '----';

        const socket = new window.ElectronicScrabbleReconnectingWebSocket(`ws://${SERVER_HOST}:${SERVER_PORT}`);
        let lastGameState = null;
        let connectionStatusKey = 'common.connecting';
        let synchronizedTurnClock = null;
        let turnClockReceivedAt = performance.now();

        /**
         * Returns a coordinate key used to highlight the last move.
         *
         * @param {number} row Board row.
         * @param {number} column Board column.
         *
         * @returns {string} Coordinate key.
         */
        function getCoordinateKey(row, column) {
            return `${row}:${column}`;
        }

        /**
         * Creates a board tile element.
         *
         * @param {Object} tile Public board tile.
         *
         * @returns {HTMLDivElement} Tile element.
         */
        function createBoardTile(tile) {
            const tileElement = document.createElement('div');
            const valueElement = document.createElement('span');

            tileElement.className = 'board-tile';
            valueElement.className = 'board-tile-value';

            tileElement.textContent = tile.isBlank
                ? (tile.assignedLetter ?? '★')
                : tile.letter;

            valueElement.textContent = tile.value;
            tileElement.appendChild(valueElement);

            return tileElement;
        }

        /**
         * Creates a board cell element.
         *
         * @param {Object} cell Public board cell.
         * @param {Set<string>} lastMoveCoordinates Last-move coordinate set.
         *
         * @returns {HTMLDivElement} Board cell element.
         */
        function createBoardCell(cell, lastMoveCoordinates, pendingMoveCoordinates) {
            const cellElement = document.createElement('div');
            const isCenter = cell.row === 7 && cell.column === 7;
            const coordinateKey = getCoordinateKey(cell.row, cell.column);

            cellElement.className = 'board-cell';
            cellElement.setAttribute('role', 'gridcell');

            if (cell.premium !== null && PREMIUM_LABELS[cell.premium]) {
                cellElement.classList.add(
                    PREMIUM_LABELS[cell.premium].className
                );
            }

            if (pendingMoveCoordinates.has(coordinateKey)) {
                cellElement.classList.add('board-cell--pending-move');
            } else if (lastMoveCoordinates.has(coordinateKey)) {
                cellElement.classList.add('board-cell--last-move');
            }

            if (cell.tile !== null) {
                cellElement.appendChild(createBoardTile(cell.tile));
                return cellElement;
            }

            if (isCenter) {
                cellElement.textContent = '★';
                return cellElement;
            }

            if (cell.premium !== null && PREMIUM_LABELS[cell.premium]) {
                cellElement.textContent = I18n.t(PREMIUM_LABELS[cell.premium].key);
            }

            return cellElement;
        }

        /**
         * Renders the public board matrix.
         *
         * @param {Array<Array<Object>>} board Public board matrix.
         * @param {Object|null} lastMove Last accepted public move.
         * @param {Object|null} pendingMove Move waiting for challenge resolution.
         *
         * @returns {void}
         */
        function renderBoard(board, lastMove, pendingMove) {
            const fragment = document.createDocumentFragment();
            const lastMoveCoordinates = new Set(
                (lastMove?.placements ?? []).map((placement) => (
                    getCoordinateKey(placement.row, placement.column)
                ))
            );

            const pendingMoveCoordinates = new Set(
                (pendingMove?.placements ?? []).map((placement) => (
                    getCoordinateKey(placement.row, placement.column)
                ))
            );

            board.flat().forEach((cell) => {
                fragment.appendChild(
                    createBoardCell(
                        cell,
                        lastMoveCoordinates,
                        pendingMoveCoordinates
                    )
                );
            });

            boardElement.replaceChildren(fragment);
        }


        /**
         * Renders the starting-player draw on the shared screen.
         *
         * @param {Object|null} startingPlayerDraw Starting-player draw result.
         *
         * @returns {void}
         */
        function renderStartingPlayerDraw(startingPlayerDraw) {
            startingDrawRounds.replaceChildren();

            if (startingPlayerDraw === null) {
                startingPlayerCard.hidden = true;
                return;
            }

            let revealIndex = 0;

            startingPlayerDraw.rounds.forEach((round) => {
                const row = document.createElement('div');
                const roundLabel = document.createElement('span');

                row.className = 'starting-draw-round';
                roundLabel.className = 'starting-draw-round__label';
                roundLabel.textContent = I18n.t('common.round', { round: round.round });
                row.appendChild(roundLabel);

                round.draws.forEach((draw) => {
                    const item = document.createElement('span');
                    const player = document.createElement('span');
                    const letter = document.createElement('strong');

                    item.className = 'starting-draw-item';
                    item.style.animationDelay = `${revealIndex * 120}ms`;
                    revealIndex += 1;
                    player.textContent = draw.playerName;
                    letter.className = 'starting-draw-letter';
                    letter.textContent = draw.letter;
                    item.append(player, letter);

                    if (draw.blankRedraws > 0) {
                        const note = document.createElement('small');

                        note.textContent = I18n.t('screen.blankRedraw', { count: draw.blankRedraws });
                        item.appendChild(note);
                    }

                    row.appendChild(item);
                });

                startingDrawRounds.appendChild(row);
            });

            startingPlayerWinner.textContent = I18n.t('screen.playerFirst', {
                name: startingPlayerDraw.startingPlayerName
            });
            startingPlayerCard.hidden = false;
        }

        /**
         * Renders the last accepted move summary.
         *
         * @param {Object|null} lastMove Last accepted move.
         *
         * @returns {void}
         */
        function renderLastAction(lastAction) {
            if (lastAction === null) {
                lastActionCard.hidden = true;
                return;
            }

            lastActionPlayer.textContent = lastAction.playerName;
            lastActionScore.hidden = true;

            if (lastAction.type === 'move') {
                lastActionSummary.textContent = lastAction.words
                    .map((word) => `${word.text} · ${word.score}`)
                    .join('  •  ');
                lastActionScoreValue.textContent = lastAction.score;
                lastActionScore.hidden = false;
            } else if (lastAction.type === 'exchange') {
                const count = lastAction.exchangedCount;

                lastActionSummary.textContent = I18n.t('screen.lastAction.exchange', { count });
            } else if (lastAction.type === 'pass') {
                lastActionSummary.textContent = I18n.t('screen.lastAction.pass');
            } else if (lastAction.type === 'challenge-success') {
                lastActionSummary.textContent = I18n.t('screen.lastAction.challengeSuccess', {
                    challenger: lastAction.playerName,
                    player: lastAction.challengedPlayerName,
                    words: lastAction.invalidWords.join(', ')
                });
            } else {
                lastActionSummary.textContent = I18n.t('screen.lastAction.completed');
            }

            lastActionCard.hidden = false;
        }

        /**
         * Renders a move waiting for acceptance or challenge.
         *
         * @param {Object|null} pendingMove Public pending move state.
         *
         * @returns {void}
         */
        function renderPendingChallenge(pendingMove) {
            if (pendingMove === null) {
                challengeCard.hidden = true;
                return;
            }

            challengeSummary.textContent = I18n.t('screen.challengePending', {
                name: pendingMove.playerName,
                words: pendingMove.words.map((word) => word.text).join(', '),
                score: pendingMove.score
            });
            challengeCard.hidden = false;
        }

        /**
         * Formats milliseconds as a compact game clock value.
         *
         * @param {number} milliseconds Duration in milliseconds.
         *
         * @returns {string} Formatted clock value.
         */
        function formatClock(milliseconds) {
            const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            if (hours > 0) {
                return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }

            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        /**
         * Returns locally interpolated elapsed milliseconds for the latest
         * server-synchronized turn clock.
         *
         * @returns {number} Current elapsed milliseconds.
         */
        function getSynchronizedElapsedMs() {
            if (synchronizedTurnClock === null) {
                return 0;
            }

            const localDelta = synchronizedTurnClock.running
                ? performance.now() - turnClockReceivedAt
                : 0;

            return synchronizedTurnClock.elapsedMs + localDelta;
        }

        /**
         * Renders the current player's turn clock.
         *
         * @returns {void}
         */
        function renderTurnClock() {
            if (
                lastGameState === null ||
                lastGameState.status !== 'playing' ||
                synchronizedTurnClock === null ||
                synchronizedTurnClock.mode === 'off'
            ) {
                turnClockCard.hidden = true;
                return;
            }

            const currentPlayer = lastGameState.players.find(
                (player) => player.id === lastGameState.currentPlayerId
            );
            const elapsedMs = getSynchronizedElapsedMs();
            const countdown = synchronizedTurnClock.mode === 'countdown';
            const durationMs = synchronizedTurnClock.durationSeconds * 1000;
            const remainingMs = Math.max(0, durationMs - elapsedMs);
            const expired = countdown && elapsedMs >= durationMs;

            turnClockValue.textContent = formatClock(
                countdown ? Math.ceil(remainingMs / 1000) * 1000 : elapsedMs
            );
            turnClockPlayer.textContent = currentPlayer
                ? I18n.t('screen.clockPlayer', { name: currentPlayer.name })
                : I18n.t('common.waiting');

            turnClockState.className = 'status';
            turnClockCard.classList.toggle('turn-clock-card--expired', expired);

            if (expired) {
                turnClockState.textContent = I18n.t('clock.expired');
                turnClockState.classList.add('status--danger');
            } else if (!synchronizedTurnClock.running) {
                turnClockState.textContent = I18n.t('clock.paused');
                turnClockState.classList.add('status--warning');
            } else if (countdown) {
                turnClockState.textContent = I18n.t('clock.countdown');
                turnClockState.classList.add('status--success');
            } else {
                turnClockState.textContent = I18n.t('clock.elapsed');
                turnClockState.classList.add('status--success');
            }

            turnClockCard.hidden = false;
        }

        /**
         * Returns a human-readable end-game reason.
         *
         * @param {string} reason End-game reason code.
         *
         * @returns {string} End-game reason label.
         */
        function getEndReasonLabel(reason) {
            if (reason === 'rack-emptied') {
                return I18n.t('end.rackEmptied');
            }

            if (reason === 'consecutive-passes') {
                return I18n.t('end.consecutivePasses');
            }

            return I18n.t('end.default');
        }

        /**
         * Renders the public final score table.
         *
         * @param {Object|null} finalResult Public final result.
         *
         * @returns {void}
         */
        function renderFinalResult(finalResult) {
            finalRanking.replaceChildren();

            if (finalResult === null) {
                finalResultCard.hidden = true;
                return;
            }

            const winners = finalResult.rankings.filter(
                (ranking) => finalResult.winnerIds.includes(ranking.playerId)
            );

            finalWinner.textContent = winners.length === 1
                ? I18n.t('final.winner', { name: winners[0].playerName })
                : I18n.t('final.winners', {
                    names: winners.map((winner) => winner.playerName).join(', ')
                });

            endReasonElement.textContent = getEndReasonLabel(finalResult.reason);

            finalResult.rankings.forEach((ranking) => {
                const item = document.createElement('li');
                const adjustment = ranking.adjustment >= 0
                    ? `+${ranking.adjustment}`
                    : String(ranking.adjustment);

                item.textContent = I18n.t('screen.finalRanking', {
                    name: ranking.playerName,
                    score: ranking.finalScore,
                    adjustment
                });

                finalRanking.appendChild(item);
            });

            finalResultCard.hidden = false;
        }

        /**
         * Updates the public game state on the shared display.
         *
         * @param {Object} game Public game state.
         *
         * @returns {void}
         */
        function updateGameState(game) {
            lastGameState = game;
            synchronizedTurnClock = game.turnClock ?? null;
            turnClockReceivedAt = performance.now();
            renderTurnClock();

            const statusKey = {
                lobby: 'common.lobby',
                starting: 'common.starting',
                playing: 'common.playing',
                finished: 'common.finished'
            }[game.status] ?? 'common.waiting';
            gameStatusElement.textContent = I18n.t(statusKey);
            renderStartingPlayerDraw(
                game.status === 'starting' ? game.startingPlayerDraw : null
            );
            wordValidationStatus.textContent = game.wordValidation?.enabled
                ? (game.wordValidation.policy === 'challenge'
                    ? I18n.t('screen.validationChallenge', {
                        name: game.wordValidation.dictionaryName
                    })
                    : game.wordValidation.dictionaryName)
                : I18n.t('screen.structuralOnly');
            playerList.replaceChildren();

            if (game.bagRemaining !== null) {
                bagInformation.hidden = false;
                bagRemainingElement.textContent = game.bagRemaining;
            } else {
                bagInformation.hidden = true;
            }

            if (game.status === 'playing') {
                const currentPlayer = game.players.find(
                    (player) => player.id === game.currentPlayerId
                );

                turnNumberElement.textContent = game.turnNumber;
                currentPlayerNameElement.textContent = currentPlayer
                    ? I18n.t('screen.currentPlayer', { name: currentPlayer.name })
                    : I18n.t('common.waiting');
                turnInformation.hidden = false;
            } else {
                turnInformation.hidden = true;
            }

            if (Array.isArray(game.board)) {
                renderBoard(game.board, game.lastMove, game.pendingMove);
            }

            renderPendingChallenge(game.pendingMove ?? null);
            renderLastAction(game.lastAction);
            renderFinalResult(game.finalResult);

            game.players.forEach((player) => {
                const item = document.createElement('li');
                const name = document.createElement('strong');
                const metadata = document.createElement('span');
                const isCurrent = player.id === game.currentPlayerId;

                name.textContent = player.name;
                metadata.className = 'screen-player-meta';

                if (game.status === 'playing') {
                    metadata.textContent = I18n.t('screen.player.playing', { score: player.score, count: player.rackCount });
                } else if (game.status === 'finished') {
                    metadata.textContent = I18n.t('screen.player.final', { score: player.score });
                } else {
                    metadata.textContent = player.connected ? I18n.t('common.connected') : I18n.t('common.disconnected');
                }

                if (isCurrent) {
                    item.classList.add('screen-player--current');
                }

                item.append(name, metadata);
                playerList.appendChild(item);
            });
        }

        setInterval(renderTurnClock, 250);

        socket.addEventListener('open', () => {
            connectionStatusKey = 'common.connected';
            connectionStatus.textContent = I18n.t(connectionStatusKey);
            connectionStatus.className = 'status status--success';

            if (!gameCode) {
                connectionStatusKey = 'screen.missingGameCode';
                connectionStatus.textContent = I18n.t(connectionStatusKey);
                connectionStatus.className = 'status status--danger';
                return;
            }

            socket.send(JSON.stringify({
                type: 'watch-game',
                gameCode
            }));
        });

        socket.addEventListener('close', () => {
            connectionStatusKey = 'common.disconnected';
            connectionStatus.textContent = I18n.t(connectionStatusKey);
            connectionStatus.className = 'status status--danger';
        });

        socket.addEventListener('error', () => {
            connectionStatusKey = 'common.connectionError';
            connectionStatus.textContent = I18n.t(connectionStatusKey);
            connectionStatus.className = 'status status--danger';
        });

        document.addEventListener('electronic-scrabble:language-changed', () => {
            connectionStatus.textContent = I18n.t(connectionStatusKey);

            if (lastGameState !== null) {
                updateGameState(lastGameState);
            }
        });

        socket.addEventListener('message', (event) => {
            const data = JSON.parse(event.data);

            if (
                data.type === 'game-state' &&
                data.game.code === gameCode
            ) {
                updateGameState(data.game);
                return;
            }

            if (data.type === 'error') {
                connectionStatus.textContent = I18n.t(`error.${data.code}`) === `error.${data.code}` ? data.message : I18n.t(`error.${data.code}`);
                connectionStatus.className = 'status status--danger';
            }
        });
    </script>
</body>
</html>
