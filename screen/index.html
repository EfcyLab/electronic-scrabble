<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electronic Scrabble - Shared Screen</title>
</head>

<body>
    <main>
        <h1>Electronic Scrabble</h1>

        <p id="connection-status">
            Connecting...
        </p>

        <section>
            <h2>
                Game <span id="game-code">----</span>
            </h2>

            <h3>Players</h3>

            <ul id="player-list"></ul>
        </section>
    </main>

    <script>
        /**
         * Electronic Scrabble Shared Screen Client
         *
         * Displays the public state of a game session.
         *
         * @version 0.2.0
         */

        const SERVER_HOST = window.location.hostname || 'localhost';
        const SERVER_PORT = 8080;

        const parameters = new URLSearchParams(
            window.location.search
        );

        const gameCode = parameters.get('game')?.toUpperCase() ?? '';

        const connectionStatus = document.getElementById(
            'connection-status'
        );

        const gameCodeElement = document.getElementById(
            'game-code'
        );

        const playerList = document.getElementById('player-list');

        gameCodeElement.textContent = gameCode || '----';

        const socket = new WebSocket(
            `ws://${SERVER_HOST}:${SERVER_PORT}`
        );

        /**
         * Updates the displayed player list.
         *
         * @param {Array<Object>} players Public player list.
         *
         * @returns {void}
         */
        function updatePlayerList(players) {
            playerList.replaceChildren();

            players.forEach((player) => {
                const item = document.createElement('li');

                item.textContent = player.name;

                playerList.appendChild(item);
            });
        }

        socket.addEventListener('open', () => {
            connectionStatus.textContent = 'Connected';

            if (!gameCode) {
                connectionStatus.textContent = 'Missing game code';
                return;
            }

            socket.send(JSON.stringify({
                type: 'watch-game',
                gameCode
            }));
        });

        socket.addEventListener('close', () => {
            connectionStatus.textContent = 'Disconnected';
        });

        socket.addEventListener('error', () => {
            connectionStatus.textContent = 'Connection error';
        });

        socket.addEventListener('message', (event) => {
            const data = JSON.parse(event.data);

            if (
                data.type === 'game-state' &&
                data.game.code === gameCode
            ) {
                updatePlayerList(data.game.players);

                return;
            }

            if (data.type === 'error') {
                connectionStatus.textContent = data.message;
            }
        });
    </script>
</body>
</html>
